# GitLab CI/CD pipeline for OSS
#
# Execution model:
# - Feature branch pushes: no pipeline
# - Merge request updates: no pipeline
# - Merge/push to main: unit tests automatically
# - Explicit "Run pipeline": unit + integration automatically
# - SAST: manual only
#
# The installation selects the runner through the required CI_RUNNER_TAG
# project variable. GitLab.com may remain the CI control plane while jobs run
# on either GitLab-hosted or self-hosted infrastructure. See
# docs/development/GITLAB_RUNNER.md.

workflow:
  rules:
    # Run when code lands on main
    - if: '$CI_COMMIT_BRANCH == "main"'

    # Allow explicitly started pipelines
    - if: '$CI_PIPELINE_SOURCE == "web"'

    # Nothing for ordinary branch pushes / MR updates
    - when: never


stages:
  - test
  - security


default:
  tags:
    - $CI_RUNNER_TAG


variables:
  # Required project CI/CD variable. It intentionally has no repository-level
  # default because runner tags are installation-specific infrastructure.
  UV_CACHE_DIR: "$CI_PROJECT_DIR/.cache/uv"


cache:
  key:
    files:
      - uv.lock
  paths:
    - .cache/uv/
  policy: pull-push


# ---------------------------------------------------------------------------
# Unit Tests
#
# Automatic:
#   - Merge/push to main
#   - Explicit UI pipeline
# ---------------------------------------------------------------------------

unit-tests:
  stage: test

  before_script:
    - uv sync --frozen --python 3.12

  script:
    - uv run --python 3.12 pytest tests/unit -v --cov=ai-governance --cov-report=term-missing

  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: on_success

    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: on_success

    - when: never


# ---------------------------------------------------------------------------
# Integration Tests
#
# Provider-dependent and potentially expensive.
#
# Automatic:
#   - Explicit UI pipeline only
#
# Required CI/CD variables:
#   OPENAI_API_KEY
#   OPENAI_DEFAULT_JUDGE_MODEL
# ---------------------------------------------------------------------------

integration-tests:
  stage: test

  before_script:
    - uv sync --frozen --python 3.12

  script:
    - uv run --python 3.12 pytest tests/integration -v

  rules:
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: on_success

    - when: never


# ---------------------------------------------------------------------------
# GitLab SAST
#
# Manual only.
#
# NOTE:
# GitLab SAST analyzers generally rely on container execution. Keep this
# opt-in when using a shell-based self-hosted runner.
# ---------------------------------------------------------------------------

sast:
  stage: security

  rules:
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: manual
      allow_failure: true

    - when: never


include:
  - template: Security/SAST.gitlab-ci.yml
