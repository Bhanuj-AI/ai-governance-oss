# GitLab CI/CD pipeline for OSS
#
# Execution model:
# - Feature branch pushes: no pipeline
# - Merge request updates: no pipeline
# - Merge/push to main: unit tests automatically
# - Explicit "Run pipeline": unit + integration tests automatically
#
# Runner model:
# - Jobs are intentionally untagged.
# - GitLab-hosted runners work without repository-specific configuration.
# - Self-hosted runners can execute these jobs when configured to
#   "Run untagged jobs".
#
# Python:
# - Container runners use python:3.12.
# - Shell runners ignore `image` and uv explicitly selects Python 3.12.

workflow:
  rules:
    # Run automatically when code lands on main.
    - if: '$CI_COMMIT_BRANCH == "main"'

    # Allow explicit pipeline execution from the GitLab UI.
    - if: '$CI_PIPELINE_SOURCE == "web"'

    # No pipelines for ordinary feature branch pushes or MR updates.
    - when: never


stages:
  - test


default:
  # Used by container-based runners.
  # Ignored by shell executors such as a local macOS runner.
  image: python:3.12


variables:
  UV_CACHE_DIR: "$CI_PROJECT_DIR/.cache/uv"


cache:
  key:
    files:
      - uv.lock
  paths:
    - .cache/uv/
  policy: pull-push


# ---------------------------------------------------------------------------
# Unit Tests
#
# Automatic:
#   - Merge/push to main
#   - Explicit UI pipeline
# ---------------------------------------------------------------------------

unit-tests:
  stage: test

  before_script:
    # GitLab-hosted Python container may not have uv.
    # Self-hosted runner may already have it.
    - command -v uv >/dev/null 2>&1 || pip install --no-cache-dir uv
    # Inspect-backed unit tests verify the package-resolvable task and solver
    # contracts shipped by this repository.
    - uv sync --frozen --extra inspect --python 3.12

  script:
    - >
      uv run --python 3.12 pytest tests/unit -v
      --cov=ai_governance
      --cov-report=term-missing

  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: on_success

    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: on_success

    - when: never


# ---------------------------------------------------------------------------
# Integration Tests
#
# Provider-dependent and potentially expensive.
#
# Automatic:
#   - Explicit UI pipeline only
#
# Required CI/CD variables:
#   OPENAI_API_KEY
#   OPENAI_DEFAULT_JUDGE_MODEL
# ---------------------------------------------------------------------------

integration-tests:
  stage: test

  before_script:
    - command -v uv >/dev/null 2>&1 || pip install --no-cache-dir uv
    - uv sync --frozen --python 3.12

  script:
    - uv run --python 3.12 pytest tests/integration -v

  rules:
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: on_success

    - when: never
