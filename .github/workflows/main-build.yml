name: Main Distribution Smoke Test

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v5

      - name: Build distributable wheels without local source overrides
        run: |
          uv build --no-sources --wheel --out-dir "$GITHUB_WORKSPACE/dist/core"
          uv build --directory packages/bhanuj-governance-plugin-api \
            --no-sources --wheel --out-dir "$GITHUB_WORKSPACE/dist/plugin-api"

      - name: Install release-candidate wheels and verify imports
        run: |
          cd "$RUNNER_TEMP"
          uv venv release-candidate
          uv pip install --python release-candidate/bin/python \
            "$GITHUB_WORKSPACE"/dist/plugin-api/*.whl \
            "$GITHUB_WORKSPACE"/dist/core/*.whl
          release-candidate/bin/python -c "import ai_governance; import bhanuj_governance_plugin_api; from importlib.metadata import version; print(version('ai-governance'), version('bhanuj-governance-plugin-api'))"
          uv pip check --python release-candidate/bin/python

      - name: Verify packaged SPI boundary
        run: |
          cd "$RUNNER_TEMP"

          release-candidate/bin/python - <<'PY'
          import importlib.metadata
          import bhanuj_governance_plugin_api

          # Canonical plugin entry-point namespace must be queryable.
          eps = importlib.metadata.entry_points()
          list(eps.select(group="bhanuj.governance.plugins"))

          # Confirm the independently versioned package is installed.
          print(
              "Plugin API:",
              importlib.metadata.version("bhanuj-governance-plugin-api")
          )

          print("SPI package import: OK")
          PY
