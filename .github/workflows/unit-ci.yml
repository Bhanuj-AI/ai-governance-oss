name: Unit Tests

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v5

      # Inspect-backed unit tests verify the package-resolvable task and solver
      # contracts shipped by this repository.
      - run: uv sync --frozen --extra inspect

      - name: Run unit tests with coverage
        run: uv run pytest tests/unit -v --cov=ai-governance --cov-report=term-missing
