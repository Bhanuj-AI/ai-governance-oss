[project]
name = "ai-governance"
version = "1.1.1"
description = "AI Governance Control Plane for execution audit, workflow replay, evaluation, decision-drift analysis, and governance controls for AI systems."
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "anthropic>=0.89.0",
    "boto3>=1.43.69",
    "fastapi>=0.138.1",
    "psycopg[binary]>=3.3.2",
    "pydantic>=2.13.4",
    "packaging>=26.3",
    "python-multipart>=0.0.20",
    "python-dotenv>=1.2.2",
    "jsonschema>=4.26.0",
    "PyYAML>=6.0",
    "rich>=13.9.4",
    "snowflake-connector-python>=4.7.2",
    "trulens>=2.10.0",
    "trulens-connectors-snowflake>=2.10.0",
    "trulens-core>=2.10.0",
    "trulens-providers-openai>=2.10.0",
    "uvicorn>=0.52.1",
    "PyJWT>=2.10.0",
    "mcp>=2,<3",
    "neo4j>=6.2.0,<7",
]

[project.urls]
Homepage = "https://governance.bhanuj.ai"
Documentation = "https://governance.bhanuj.ai/docs"
Tutorials = "https://governance.bhanuj.ai/tutorials"
Repository = "https://gitlab.com/bhanuj-ai/ai-governance-oss.git"

[project.optional-dependencies]
inspect = [
    "inspect-ai>=0.3",
]

[project.scripts]
ai-governance = "ai_governance.cli:main"
ai-governance-mcp = "ai_governance.mcp.cli:main"
ai-governance-graph = "ai_governance.ontology.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_governance"]

[tool.pytest.ini_options]
markers = [
    "unit: isolated unit tests",
    "integration: tests that exercise multiple components or external backends",
    "api: FastAPI REST control-plane tests",
]

[tool.ruff.lint.per-file-ignores]
# FastAPI evaluates `Depends` declarations in parameter defaults as part of its
# dependency-injection contract; they are not mutable application defaults.
"src/ai_governance/api/**/*.py" = ["B008"]
# Keep connection acquisition and cursor lifetime visually nested in Snowflake
# adapters, where transaction ownership is deliberately explicit.
"src/ai_governance/repositories/snowflake/*.py" = ["SIM117"]
