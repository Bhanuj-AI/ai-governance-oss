[project]
name = "ai-governance"
version = "1.0.3"
description = "Open-source AI governance control plane for governed AI assets, evaluations, replay, audit, and deterministic governance."
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "boto3>=1.43.34",
    "fastapi>=0.138.1",
    "psycopg[binary]>=3.3.2",
    "pydantic>=2.13.4",
    "packaging>=24.2",
    "python-multipart>=0.0.20",
    "python-dotenv>=1.2.2",
    "PyYAML>=6.0",
    "rich>=13.9.4",
    "snowflake-connector-python>=4.6.0",
    "trulens>=2.10.0",
    "trulens-connectors-snowflake>=2.10.0",
    "trulens-core>=2.10.0",
    "trulens-providers-openai>=2.10.0",
    "uvicorn>=0.49.0",
    "PyJWT>=2.10.0",
    "mcp>=1.26,<2",
    "neo4j>=5.28,<6",
]

[project.urls]
Homepage = "https://ai-governance.bhanuj.app"
Documentation = "https://ai-governance.bhanuj.app/docs"
Tutorials = "https://ai-governance.bhanuj.app/tutorials"
Repository = "https://github.com/Bhanuj-AI/ai-governance-oss.git"

[project.scripts]
ai-governance = "ai_governance.cli:main"
ai-governance-mcp = "ai_governance.mcp.cli:main"
ai-governance-graph = "ai_governance.ontology.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.19",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_governance"]

[tool.pytest.ini_options]
markers = [
    "unit: isolated unit tests",
    "integration: tests that exercise multiple components or external backends",
    "api: FastAPI REST control-plane tests",
]
