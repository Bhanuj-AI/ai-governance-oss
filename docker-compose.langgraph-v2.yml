# Explicit local-development override for the LangGraph ToolNode v2 live lab.
# Invoke it alongside docker-compose.yml; it is not part of the default stack.
services:
  ai-governance-replay-worker:
    build:
      context: ..
      dockerfile: ai-governance-oss/docker/Dockerfile.langgraph-v2-replay-worker
    image: ai-governance-platform-langgraph-v2:local
    environment:
      AIGP_LANGGRAPH_REPLAY_SNAPSHOT_DB: /var/lib/aigp-langgraph/langgraph-v2-snapshots.db
    volumes:
      # Runtime-owned private snapshots. The API and Studio do not mount this path.
      - ../labs/agent-frameworks/langgraph/langgraph-execution-assurance-lab-v2/live/runtime-data:/var/lib/aigp-langgraph:ro
